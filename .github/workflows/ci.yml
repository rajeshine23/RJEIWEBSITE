name: RAJISHINE CI & Validation

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate-and-build:
    name: Catalogue Validation & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Validate CSV Catalogue
        run: npm run validate:catalogue

      - name: Validate Repository Image Assets
        run: npm run validate:images

      - name: Run Automated Test Suite
        run: npm test

      - name: TypeScript Type Check
        run: npm run typecheck

      - name: Next.js Static Production Build
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: "https://rajishine.com"
